<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ASISSE AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cabinet+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
/* ── Variables ─────────────────────────────────────────── */
:root {
  --bg:        #06080F;
  --surface:   #0D1117;
  --border:    rgba(255,255,255,0.07);
  --accent:    #00E5FF;
  --accent2:   #BF5FFF;
  --text:      #C9D1D9;
  --muted:     #3D4F61;
  --user-bg:   #0D2137;
  --bot-bg:    #0D1117;
  --font-head: 'Bebas Neue', sans-serif;
  --font-body: 'Cabinet Grotesk', sans-serif;
}

/* ── Reset ─────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Noise overlay ─────────────────────────────────────── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
  opacity: 0.4;
}

/* ── Ambient glow ──────────────────────────────────────── */
.glow-orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(120px);
  pointer-events: none;
  z-index: 0;
}
.glow-orb.a {
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(0,229,255,0.06), transparent 70%);
  top: -100px; left: -100px;
}
.glow-orb.b {
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(191,95,255,0.06), transparent 70%);
  bottom: 0; right: -80px;
}

/* ── Layout ────────────────────────────────────────────── */
.app {
  position: relative;
  z-index: 1;
  max-width: 820px;
  margin: 0 auto;
  padding: 0 20px 140px;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* ── Header ────────────────────────────────────────────── */
header {
  padding: 48px 0 32px;
  text-align: center;
  animation: fadeDown 0.7s ease both;
}

@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-20px); }
  to   { opacity: 1; transform: translateY(0); }
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(0,229,255,0.06);
  border: 1px solid rgba(0,229,255,0.18);
  color: var(--accent);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 3px;
  text-transform: uppercase;
  padding: 5px 14px;
  border-radius: 100px;
  margin-bottom: 22px;
}

.badge::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
  animation: pulse 2s ease infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%       { opacity: 0.4; transform: scale(0.7); }
}

h1 {
  font-family: var(--font-head);
  font-size: clamp(3.5rem, 9vw, 6.5rem);
  line-height: 0.92;
  letter-spacing: 2px;
  color: #fff;
  margin-bottom: 14px;
}

h1 .hl {
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.subtitle {
  font-size: 14px;
  color: var(--muted);
  font-weight: 300;
  letter-spacing: 0.3px;
  line-height: 1.7;
  max-width: 440px;
  margin: 0 auto;
}

/* ── Stats ─────────────────────────────────────────────── */
.stats {
  display: flex;
  justify-content: center;
  margin: 28px auto 0;
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  max-width: 440px;
  animation: fadeDown 0.7s 0.1s ease both;
}

.stat {
  flex: 1;
  padding: 12px 8px;
  text-align: center;
  background: var(--surface);
}

.stat-n {
  font-family: var(--font-head);
  font-size: 22px;
  letter-spacing: 1px;
  color: var(--accent);
  display: block;
  line-height: 1;
}

.stat-l {
  font-size: 9px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1.8px;
  display: block;
  margin-top: 3px;
}

/* ── Divider ───────────────────────────────────────────── */
.hr {
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,229,255,0.15), transparent);
  margin: 32px 0;
  animation: fadeDown 0.7s 0.15s ease both;
}

/* ── Suggestions ───────────────────────────────────────── */
#suggestions {
  animation: fadeDown 0.7s 0.2s ease both;
}

.sug-label {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 2.5px;
  text-align: center;
  margin-bottom: 12px;
}

.sug-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
}

.chip {
  background: rgba(0,229,255,0.04);
  border: 1px solid rgba(0,229,255,0.15);
  color: rgba(0,229,255,0.8);
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 400;
  padding: 7px 16px;
  border-radius: 100px;
  cursor: pointer;
  transition: all 0.2s ease;
  letter-spacing: 0.2px;
}

.chip:hover {
  background: rgba(0,229,255,0.1);
  border-color: rgba(0,229,255,0.35);
  transform: translateY(-2px);
  box-shadow: 0 4px 20px rgba(0,229,255,0.1);
}

/* ── Chat area ─────────────────────────────────────────── */
#chat {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding: 8px 0;
}

/* ── Message ───────────────────────────────────────────── */
.msg {
  display: flex;
  gap: 12px;
  animation: msgIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(14px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.msg.user { flex-direction: row-reverse; }

.av {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
  margin-top: 2px;
}

.av.u { background: linear-gradient(135deg, #0D3A5C, #1A1040); border: 1px solid rgba(0,229,255,0.2); }
.av.b { background: linear-gradient(135deg, #0D1117, #161B22); border: 1px solid var(--border); }

.bubble-wrap { display: flex; flex-direction: column; max-width: 75%; }
.msg.user .bubble-wrap { align-items: flex-end; }

.bubble {
  padding: 13px 17px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.7;
  font-weight: 400;
  position: relative;
  word-break: break-word;
}

.msg.user .bubble {
  background: var(--user-bg);
  border: 1px solid rgba(0,229,255,0.15);
  color: #DDF4FF;
  border-bottom-right-radius: 4px;
}

.msg.bot .bubble {
  background: var(--bot-bg);
  border: 1px solid var(--border);
  color: var(--text);
  border-bottom-left-radius: 4px;
}

.ts {
  font-size: 10px;
  color: var(--muted);
  margin-top: 5px;
  padding: 0 4px;
}

/* ── Typing indicator ──────────────────────────────────── */
.typing .bubble {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 14px 18px;
}

.dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  animation: dotBounce 1.2s ease infinite;
}
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes dotBounce {
  0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
  40%           { transform: translateY(-6px); opacity: 1; }
}

/* ── Input bar ─────────────────────────────────────────── */
.input-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: linear-gradient(to top, var(--bg) 60%, transparent);
  padding: 20px;
  z-index: 50;
}

.input-inner {
  max-width: 820px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 10px 14px;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.input-inner:focus-within {
  border-color: rgba(0,229,255,0.4);
  box-shadow: 0 0 0 4px rgba(0,229,255,0.06), 0 8px 32px rgba(0,0,0,0.4);
}

#query {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: #E6EDF3;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 400;
  caret-color: var(--accent);
  resize: none;
  max-height: 120px;
  line-height: 1.5;
}

#query::placeholder { color: var(--muted); }

#send-btn {
  width: 38px; height: 38px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: transform 0.15s, opacity 0.15s;
}

#send-btn:hover { transform: scale(1.08); }
#send-btn:active { transform: scale(0.95); opacity: 0.8; }
#send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

#send-btn svg { width: 16px; height: 16px; fill: #000; }

/* ── Scrollbar ─────────────────────────────────────────── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.15); border-radius: 4px; }
</style>
</head>
<body>

<div class="glow-orb a"></div>
<div class="glow-orb b"></div>

<div class="app">

  <!-- Header -->
  <header>
    <div class="badge">NSO · Government of India · Live</div>
    <h1>ASISSE<br><span class="hl">AI ASSISTANT</span></h1>
    <p class="subtitle">Annual Survey of Incorporated Services Sector Enterprises — Ask anything about the survey documentation</p>
    <div class="stats">
      <div class="stat"><span class="stat-n">5,103</span><span class="stat-l">Q&amp;A Pairs</span></div>
      <div class="stat"><span class="stat-n">432</span><span class="stat-l">Pages</span></div>
      <div class="stat"><span class="stat-n">RAG</span><span class="stat-l">Powered</span></div>
      <div class="stat"><span class="stat-n">Groq</span><span class="stat-l">LLaMA 3.3</span></div>
    </div>
  </header>

  <div class="hr"></div>

  <!-- Suggestions -->
  <div id="suggestions">
    <div class="sug-label">Suggested questions</div>
    <div class="sug-grid">
      <button class="chip" onclick="sendChip(this)">What is the objective of ASISSE?</button>
      <button class="chip" onclick="sendChip(this)">How is data collected?</button>
      <button class="chip" onclick="sendChip(this)">What is GVA?</button>
      <button class="chip" onclick="sendChip(this)">Is participation mandatory?</button>
      <button class="chip" onclick="sendChip(this)">What is a Financial Year?</button>
      <button class="chip" onclick="sendChip(this)">How to fill Block 3?</button>
    </div>
  </div>

  <!-- Chat -->
  <div id="chat"></div>

</div>

<!-- Input bar -->
<div class="input-bar">
  <div class="input-inner">
    <textarea id="query" rows="1" placeholder="Ask about ASISSE survey documentation..."></textarea>
    <button id="send-btn" onclick="sendMessage()" title="Send">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
</div>

<script>
const chat      = document.getElementById('chat');
const queryEl   = document.getElementById('query');
const sendBtn   = document.getElementById('send-btn');
const sugBox    = document.getElementById('suggestions');

// Auto-resize textarea
queryEl.addEventListener('input', () => {
  queryEl.style.height = 'auto';
  queryEl.style.height = queryEl.scrollHeight + 'px';
});

// Send on Enter (Shift+Enter = newline)
queryEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

function sendChip(el) {
  queryEl.value = el.textContent;
  sendMessage();
}

function now() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function addMessage(role, text) {
  const isUser = role === 'user';
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="av ${isUser ? 'u' : 'b'}">${isUser ? '👤' : '📊'}</div>
    <div class="bubble-wrap">
      <div class="bubble">${text}</div>
      <span class="ts">${now()}</span>
    </div>`;
  chat.appendChild(div);
  div.scrollIntoView({ behavior: 'smooth', block: 'end' });
  return div;
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'msg bot typing';
  div.id = 'typing';
  div.innerHTML = `
    <div class="av b">📊</div>
    <div class="bubble-wrap">
      <div class="bubble">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>`;
  chat.appendChild(div);
  div.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

async function sendMessage() {
  const q = queryEl.value.trim();
  if (!q) return;

  // Hide suggestions after first message
  sugBox.style.display = 'none';

  // Reset input
  queryEl.value = '';
  queryEl.style.height = 'auto';
  sendBtn.disabled = true;

  addMessage('user', q);
  addTyping();

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q })
    });

    const data = await res.json();
    removeTyping();
    addMessage('bot', data.answer);

  } catch (err) {
    removeTyping();
    addMessage('bot', '⚠️ Could not reach the server. Make sure app.py is running.');
  }

  sendBtn.disabled = false;
  queryEl.focus();
}
</script>
</body>
</html>
